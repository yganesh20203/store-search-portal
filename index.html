<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Portal</title>
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.24/jsrsasign-all-min.js"></script>
</head>
<body>

    <div id="app-container">
        <div id="auth-overlay">
            <h1>Internal Data Portal</h1>
            <p>Enter the Team Access Key to unlock data.</p>
            <div class="login-box">
                <input type="password" id="access-key" placeholder="Enter Access Key..." />
                <button onclick="unlockAndLogin()">Unlock & Connect</button>
                <p id="error-msg" style="color: red; display: none;"></p>
            </div>
        </div>

        <div id="dashboard" class="hidden">
            <header>
                <h2>Store Search App</h2>
                <div id="user-info">Service Account Connected</div>
            </header>
            
            <main>
                <div class="control-panel">
                    <button onclick="loadSalesDashboard()" class="nav-btn">📊 Sales Reports</button>
                    <button onclick="alert('Coming in Phase 4!')" class="nav-btn">👥 Member DB</button>
                </div>
                
                <div id="sales-ui" class="hidden">
                    <hr>
                    <div id="month-list" class="folder-grid">Loading Months...</div>
                    
                    <div id="store-search-box" class="hidden" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                        <h3>Step 2: Load Report</h3>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="store-id-input" placeholder="Enter Store ID (e.g. 4702)" style="padding: 8px;">
                            <button onclick="findAndLoadReport()">🚀 Load Data</button>
                        </div>
                    </div>

                    <div id="filter-box" class="hidden" style="margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px; border: 1px solid #90caf9;">
                        <h3>Step 3: Filter & Customize</h3>
                        
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <label>Filter:</label>
                            <select id="column-select" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                                <option value="all">All Columns</option>
                            </select>
                            <input type="text" id="filter-input" placeholder="Type to search..." onkeyup="applyTableFilter()" style="padding: 8px; flex-grow: 1; min-width: 200px;">
                        </div>

                        <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                            <label>Show Rows:</label>
                            <select id="row-limit-select" onchange="applyTableFilter()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                                <option value="10">10 Rows</option>
                                <option value="20">20 Rows</option>
                                <option value="50">50 Rows</option>
                                <option value="100" selected>100 Rows</option>
                                <option value="500">500 Rows</option>
                                <option value="all">Show All</option>
                            </select>
                            <span style="font-size: 12px; color: #666; margin-left: 10px;">*Click any table header below to Sort. Click a row to view details.</span>
                        </div>
                    </div>
                </div>

                <div id="content-area" style="margin-top: 20px; overflow-x: auto;"></div>
            </main>
        </div>
    </div>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📄 Row Details</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body" class="modal-body">
                </div>
            <div class="modal-footer">
                <button onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
