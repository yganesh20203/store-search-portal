<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Portal</title>
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.24/jsrsasign-all-min.js"></script>
</head>
<body>

    <div id="app-container">
        <div id="auth-overlay">
            <h1>Internal Data Portal</h1>
            <p>Enter the Team Access Key to unlock data.</p>
            
            <div class="login-box">
                <input type="password" id="access-key" placeholder="Enter Access Key..." />
                <button onclick="unlockAndLogin()">Unlock & Connect</button>
                <p id="error-msg" style="color: red; display: none;"></p>
            </div>
        </div>

        <div id="dashboard" class="hidden">
            <header>
                <h2>Store Search App</h2>
                <div id="user-info">Service Account Connected</div>
            </header>
            
            <main>
                <div class="control-panel">
                    <button onclick="loadSalesDashboard()" class="nav-btn">📊 Sales Reports</button>
                    <button onclick="alert('Coming in Phase 4!')" class="nav-btn">👥 Member DB</button>
                </div>
                
                <div id="sales-ui" class="hidden">
                    <hr>
                    <div id="month-list" class="folder-grid">Loading Months...</div>
                    
                    <div id="store-search-box" class="hidden" style="margin-top: 20px;">
                        <input type="text" id="store-id-input" placeholder="Enter Store ID (e.g. 4702)">
                        <button onclick="findAndLoadReport()">🔍 Search Report</button>
                    </div>
                </div>

                <div id="content-area" style="margin-top: 20px;"></div>
            </main>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
