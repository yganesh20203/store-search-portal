<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store & Member Search Portal</title>
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div id="app-container">
        <div id="auth-overlay">
            <h1>Internal Data Portal</h1>
            <p>Verifying Organization Access...</p>
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_select="true"
                 data-itp_support="true">
            </div>
        </div>

        <div id="dashboard" class="hidden">
            <header>
                <h2>Store Search App</h2>
                <div id="user-info"></div>
            </header>
            
            <main>
                <button onclick="loadSection('sales')">📂 Search Store Reports</button>
                <button onclick="loadSection('members')">👥 Search Member DB</button>
                
                <div id="content-area"></div>
            </main>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
